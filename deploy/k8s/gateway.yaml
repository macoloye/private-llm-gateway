apiVersion: v1
kind: Namespace
metadata:
  name: private-inference
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: private-inference
data:
  gateway.json: |
    {
      "server": {"host": "0.0.0.0", "port": 8080, "tls": {"enabled": false}},
      "auth": {"api_key_file": "/etc/gateway-keys/api-keys.json"},
      "routes": [
        {
          "name": "vllm-private",
          "backend": "http://vllm.private-inference.svc.cluster.local:8000",
          "models": ["qwen-local"],
          "allowed_endpoints": [
            {"path": "/v1/chat/completions", "methods": ["POST"]},
            {"path": "/v1/completions", "methods": ["POST"]},
            {"path": "/v1/embeddings", "methods": ["POST"]},
            {"path": "/v1/models", "methods": ["GET"]}
          ]
        }
      ],
      "privacy": {"access_log": "metadata", "redact_logs": true, "redact_before_forward": false},
      "limits": {
        "max_request_body_bytes": 1048576,
        "max_output_tokens": 2048,
        "max_n": 4,
        "timeout_seconds": 120,
        "per_tenant_requests_per_minute": 120,
        "per_tenant_requests_per_day": 10000
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: private-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: private-inference-gateway:local
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/gateway/gateway.json"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
            - name: api-keys
              mountPath: /etc/gateway-keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
      volumes:
        - name: config
          configMap:
            name: gateway-config
        - name: api-keys
          secret:
            secretName: gateway-api-keys
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: private-inference
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
